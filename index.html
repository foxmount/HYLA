<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HYLA - Entrar ou Cadastrar</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
    <!-- Header/Logo -->
    <div class="text-center mb-6">
      <div class="flex justify-center items-center gap-2 mb-2">
        <i data-lucide="map-pin" class="w-8 h-8 text-blue-600"></i>
        <h1 class="text-3xl font-bold text-slate-800">HYLA</h1>
      </div>
      <p class="text-slate-500 text-sm">Cidade em Foco — Gestão Urbana Comunitária</p>
    </div>

    <!-- Abas Alternar Login / Cadastro -->
    <div class="flex border-b mb-6">
      <button id="tab-login" class="flex-1 py-2 font-semibold text-blue-600 border-b-2 border-blue-600 focus:outline-none">
        Login
      </button>
      <button id="tab-register" class="flex-1 py-2 font-semibold text-slate-400 hover:text-slate-600 focus:outline-none">
        Cadastro
      </button>
    </div>

    <!-- Formulário de Login -->
    <form id="form-login" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">E-mail</label>
        <input type="email" id="login-email" required placeholder="seu@email.com" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
        <input type="password" id="login-password" required placeholder="••••••••" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg transition duration-200">
        Entrar
      </button>
    </form>

    <!-- Formulário de Cadastro (Inicia Escondido) -->
    <form id="form-register" class="space-y-4 hidden">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">E-mail</label>
        <input type="email" id="register-email" required placeholder="seu@email.com" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
        <input type="password" id="register-password" required placeholder="••••••••" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>
      <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-lg transition duration-200">
        Criar Conta
      </button>
    </form>
  </div>

  <!-- CDN do Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Scripts do Projeto -->
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  
  <script>
    // Inicializa os ícones do Lucide
    lucide.createIcons();
  </script>
</body>
</html>
